worker_processes 1;
pid /var/lib/social-media-v2/nginx/cutover-test.pid;
error_log stderr warn;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # A root-level nginx -t must not take ownership of the host's shared
    # /var/lib/nginx temp paths used by the production reverse proxy.
    client_body_temp_path /var/lib/social-media-v2/nginx/cutover_client_temp;
    proxy_temp_path /var/lib/social-media-v2/nginx/cutover_proxy_temp;
    include social-media-v2.conf;
}
