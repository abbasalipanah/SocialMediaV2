worker_processes 1;
pid /var/lib/social-media-v2/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;
    client_body_temp_path /var/lib/social-media-v2/nginx/client_temp;
    proxy_temp_path /var/lib/social-media-v2/nginx/proxy_temp;

    server {
        listen 127.0.0.1:3026;
        server_name localhost;
        root /opt/social-media-v2/frontend/dist;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:8026;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        location = /sso/consume {
            proxy_pass http://127.0.0.1:8026;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
        }
    }
}
