upstream social_media_v2_api {
    server 127.0.0.1:8026;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name social.theaccumulate.com;
    ssl_certificate /etc/letsencrypt/live/social.theaccumulate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/social.theaccumulate.com/privkey.pem;

    root /opt/social-media-v2/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://social_media_v2_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /sso/consume {
        access_log off;
        proxy_pass http://social_media_v2_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
}
