upstream social_media_v2_api {
    server 127.0.0.1:8026;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name social.theaccumulate.com;
    client_max_body_size 200m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name social.theaccumulate.com;
    client_max_body_size 200m;

    # The active certificate already serves this hostname. Keep the proven
    # certificate path during the upstream-only cutover.
    ssl_certificate /etc/letsencrypt/live/app.theaccumulate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.theaccumulate.com/privkey.pem;

    root /opt/social-media-v2/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://social_media_v2_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /sso/consume {
        access_log off;
        proxy_pass http://social_media_v2_api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
}
