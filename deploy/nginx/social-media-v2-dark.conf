# OFFLINE DRAFT ONLY. This loopback listener is not installed or included.
upstream social_media_v2_dark_api {
    server 127.0.0.1:8010;
    keepalive 4;
}

server {
    listen 127.0.0.1:8089;
    server_name _;

    location = /api/health {
        proxy_pass http://social_media_v2_dark_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/operations/readiness {
        proxy_pass http://social_media_v2_dark_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
